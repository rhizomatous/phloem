[project]
name = "phloem"
version = "0.1.0"
description = "sparse autoencoder training for MoE language models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "eai-sparsify",
    "transformers>=5.5",
    "datasets>=3,<4",
    "torch",
    "safetensors",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
]

[tool.ruff]
target-version = "py310"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
